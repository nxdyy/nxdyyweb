        * {

        /* Custom cursor */
        .cursor {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }
        
        .cursor-follower {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 1px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, border-radius 0.3s;

        /* Glow effect for title */

        /* Button styles */
        .theme-btn {
            border: 1px solid #ffffff;
            background: transparent;
            color: #ffffff;
            padding: 8px 16px;
            margin: 5px;
            font-size: 14px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .theme-btn .arrow {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            transition: right 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .theme-btn:hover .arrow {
            right: 10px;
        }
        
        /* Text control styles */

            justify-content: center;

        .theme-text:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .theme-text .arrow {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .theme-text:hover .arrow {
            right: 5px;
        }
        
        /* Navigation */

            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .theme-nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            position: relative;
        }
        
        .theme-nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #ffffff;
            transition: width 0.3s;
        }
        
        .theme-nav a:hover::after {
            width: 100%;
        }
        
        /* Main content */
        .main-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
        }
        
        /* Blog title */
        .blog-title {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* Button container */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }
        
        /* Article list */
        .article-list {
            width: 100%;

            margin-top: 100px;
        }
        
        .article-item {

            margin: 20px 0;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .article-item:hover {
            border-color: #ffffff;
            transform: translateX(10px);
        }
        
        .article-item h2 {
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        
        .article-item p {
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
        }
        
        /* Footer */
        .theme-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
